services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
      POSTGRES_DB: college
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college -d college"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://college:college@db:5432/college?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Hot reload via `docker compose up --watch`: Compose copies changed files into the
    # container (bind mounts on Docker Desktop can serve stale files after an editor save)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - generated/
        # Schema, migrations, seed or dependency changes: rebuild the image (regenerates the
        # client) and restart, which applies new migrations
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./prisma.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  pgdata:
